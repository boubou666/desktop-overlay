name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"

      - name: Tag matches the package version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          declared=$(uv run --no-project python -c "import desktop_overlay; print(desktop_overlay.__version__)")
          tagged="${RELEASE_TAG#v}"
          tagged="${tagged%%-*}"
          test "$declared" = "$tagged"

      - name: Test
        run: uv run --no-project python -m unittest discover -s tests

      - name: Build
        run: uv build --no-sources

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Keep packages for the GitHub release
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/

      - name: Release notes from changelog
        shell: uv run --no-project python {0}
        run: |
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].lstrip("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              r"^## \[" + re.escape(version)
              + r"\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          found = pattern.search(text)
          body = found.group(1).strip() if found else ""
          Path("release-notes.md").write_text(
              (body or "See the changelog for this release.") + "\n",
              encoding="utf-8",
          )

      - name: Keep release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          prerelease=""
          case "$RELEASE_TAG" in *-*) prerelease="--prerelease";; esac
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "desktop-overlay $RELEASE_TAG" --notes-file release-notes.md $prerelease dist/*
